<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SchreckNet</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

  :root {
    --vert: #33ff66;
    --vert-terne: #1a8f3c;
    --fond: #050805;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--fond);
    font-family: 'Share Tech Mono', monospace;
    color: var(--vert);
  }

  body {
    display: flex;
    flex-direction: column;
    padding: 0;
  }

  /* flash d'allumage au chargement, façon vieux poste qu'on démarre */
  #allumage {
    position: fixed;
    inset: 0;
    background: var(--vert);
    z-index: 50;
    pointer-events: none;
    animation: allumage-anim 0.7s ease-out forwards;
  }
  @keyframes allumage-anim {
    0%   { opacity: 1; transform: scaleY(1); }
    55%  { opacity: 1; transform: scaleY(0.015); }
    100% { opacity: 0; transform: scaleY(0.015); }
  }

  /* scanlines + scintillement CRT, sans surcharger */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(
      to bottom,
      rgba(51,255,102,0.035) 0px,
      rgba(51,255,102,0.035) 1px,
      transparent 2px,
      transparent 3px
    );
    z-index: 5;
    animation: scintillement 7s infinite;
  }
  @keyframes scintillement {
    0%, 100% { opacity: 1; }
    48% { opacity: 1; }
    50% { opacity: 0.75; }
    52% { opacity: 1; }
    78% { opacity: 1; }
    80% { opacity: 0.9; }
    82% { opacity: 1; }
  }

  /* glitch occasionnel sur toute la page */
  body.glitch {
    animation: glitch-anim 0.18s steps(2, end) 1;
  }
  @keyframes glitch-anim {
    0%   { transform: translate(0,0);      filter: brightness(1)   hue-rotate(0deg); }
    20%  { transform: translate(-3px,1px); filter: brightness(1.5) hue-rotate(8deg); }
    40%  { transform: translate(3px,-2px); filter: brightness(0.8); }
    60%  { transform: translate(-2px,1px); filter: brightness(1.3) hue-rotate(-6deg); }
    100% { transform: translate(0,0);      filter: brightness(1); }
  }

  /* alerte rouge dramatique quand le quota est dépassé */
  #alerte-rouge {
    position: fixed;
    inset: 0;
    background: #ff2222;
    z-index: 60;
    pointer-events: none;
    mix-blend-mode: screen;
    animation: alerte-flash 1.1s ease-out forwards;
  }
  @keyframes alerte-flash {
    0%   { opacity: 0.85; }
    15%  { opacity: 0.15; }
    30%  { opacity: 0.7; }
    45%  { opacity: 0.1; }
    100% { opacity: 0; }
  }

  .msg.alerte {
    align-self: center;
    color: #ff4444;
    font-weight: bold;
    letter-spacing: 1px;
    text-align: center;
    text-shadow: 0 0 8px rgba(255,40,40,0.8);
    border-top: 1px solid rgba(255,40,40,0.5);
    border-bottom: 1px solid rgba(255,40,40,0.5);
    padding: 8px 4px;
  }

  header {
    border-bottom: 1px solid var(--vert-terne);
    padding: 14px 16px;
    text-shadow: 0 0 6px rgba(51,255,102,0.6);
    flex-shrink: 0;
  }

  .entete-ligne {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
  }

  header .titre {
    font-size: 18px;
    letter-spacing: 3px;
  }

  header .sous-titre {
    font-size: 11px;
    color: var(--vert-terne);
    margin-top: 4px;
  }

  .bouton-son {
    background: transparent;
    border: 1px solid var(--vert-terne);
    color: var(--vert);
    font-size: 14px;
    padding: 4px 9px;
    cursor: pointer;
    line-height: 1;
    flex-shrink: 0;
  }
  .bouton-son:hover { background: rgba(51,255,102,0.08); }

  .portrait {
    position: relative;
    flex-shrink: 0;
    margin: 14px auto 0;
    width: min(48vw, 210px);
    aspect-ratio: 3 / 4;
    background: #000;
    border: 1px solid var(--vert-terne);
    overflow: hidden;
  }

  .portrait::before {
    content: "";
    position: absolute;
    inset: 6px;
    border: 1px solid rgba(51,255,102,0.25);
    pointer-events: none;
  }

  .portrait-video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: grayscale(15%) contrast(1.05) brightness(0.85);
    opacity: 0.92;
    display: block;
  }

  .portrait-label {
    position: absolute;
    top: 6px;
    left: 10px;
    font-size: 10px;
    letter-spacing: 2px;
    color: var(--vert-terne);
    text-shadow: 0 0 4px rgba(51,255,102,0.5);
  }

  .badge {
    position: absolute;
    bottom: 6px;
    right: 6px;
    width: 38px;
    height: 38px;
    object-fit: contain;
    padding: 3px;
    background: rgba(0,0,0,0.45);
    border: 1px solid var(--vert-terne);
    border-radius: 50%;
    filter: drop-shadow(0 0 6px rgba(51,255,102,0.65));
  }

  /* ticker de faux logs, façon contre-mesures anti-PRISM */
  .ticker {
    overflow: hidden;
    white-space: nowrap;
    height: 20px;
    border-top: 1px solid var(--vert-terne);
    border-bottom: 1px solid var(--vert-terne);
    flex-shrink: 0;
    background: rgba(0,0,0,0.3);
  }
  .ticker-piste {
    display: flex;
    width: max-content;
    animation: defiler-ticker 40s linear infinite;
  }
  .ticker-piste span {
    padding-right: 50px;
    font-size: 10px;
    letter-spacing: 1px;
    color: var(--vert-terne);
    line-height: 20px;
  }
  @keyframes defiler-ticker {
    from { transform: translateX(0); }
    to   { transform: translateX(-50%); }
  }

  #fil {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .msg {
    max-width: 92%;
    line-height: 1.5;
    font-size: 14px;
    white-space: pre-wrap;
    transition: opacity 0.4s ease;
  }

  .msg.disparu {
    opacity: 0;
  }

  .msg .expediteur {
    font-size: 10px;
    letter-spacing: 2px;
    opacity: 0.85;
    margin-bottom: 3px;
  }

  .msg.joueur .expediteur {
    text-align: right;
    color: #5c8a6c;
  }

  .msg.nosferatu .expediteur {
    color: var(--vert);
    text-shadow: 0 0 6px rgba(51,255,102,0.6);
  }

  .msg.joueur {
    align-self: flex-end;
    color: #b8ffcc;
  }
  .msg.joueur::before { content: "> "; color: var(--vert-terne); }

  .msg.nosferatu {
    align-self: flex-start;
    text-shadow: 0 0 4px rgba(51,255,102,0.5);
  }
  .msg.nosferatu::before { content: "◈ "; }

  .msg.systeme {
    align-self: center;
    color: var(--vert-terne);
    font-size: 12px;
  }

  /* ---------- EFFACEMENT DÉFINITIF (déclenché par le prochain message) ---------- */

  body.effacement {
    animation: effacement-anim 1.8s ease-in-out forwards;
  }
  @keyframes effacement-anim {
    0%   { filter: brightness(1) contrast(1) hue-rotate(0deg); transform: translate(0,0); }
    10%  { filter: brightness(1.4) contrast(1.3) hue-rotate(10deg); transform: translate(2px,-1px); }
    20%  { filter: brightness(0.6); transform: translate(-3px,2px); }
    30%  { filter: brightness(1.6) hue-rotate(-12deg); transform: translate(3px,0); }
    40%  { filter: brightness(0.4); transform: translate(-2px,-2px); }
    50%  { filter: brightness(1.8) contrast(1.5); transform: translate(2px,2px); }
    60%  { filter: brightness(0.3); transform: translate(-4px,1px); }
    70%  { filter: brightness(1.2); transform: translate(1px,-1px); }
    85%  { filter: brightness(0.2); transform: translate(0,0); }
    100% { filter: brightness(0); transform: translate(0,0); }
  }

  /* ---------- EFFACEMENT DÉFINITIF (déclenché par le prochain message) ---------- */

  body.effacement {
    animation: effacement-anim 5s ease-in-out forwards;
  }
  @keyframes effacement-anim {
    0%   { filter: brightness(1) saturate(1) contrast(1); transform: translate(0,0) scale(1) skew(0deg,0deg); }
    8%   { filter: brightness(1.3) saturate(2) contrast(1.4); transform: translate(2px,-1px) scale(1.01) skew(1deg,0deg); }
    16%  { filter: brightness(0.6) saturate(3); transform: translate(-4px,2px) scale(0.99) skew(-1deg,0.5deg); }
    24%  { filter: brightness(1.6) saturate(0.2) contrast(1.8) hue-rotate(15deg); transform: translate(3px,0) scale(1.02) skew(2deg,-1deg); }
    32%  { filter: brightness(0.3) saturate(4); transform: translate(-3px,-3px) scale(0.98) skew(-2deg,1deg); }
    40%  { filter: brightness(1.8) contrast(2) saturate(0.1); transform: translate(4px,2px) scale(1.03) skew(1deg,2deg); }
    48%  { filter: brightness(0.2) saturate(5); transform: translate(-5px,1px) scale(0.97) skew(-3deg,-1deg); }
    56%  { filter: brightness(1.4) contrast(2.2); transform: translate(2px,-2px) scale(1.04) skew(2deg,0deg); }
    64%  { filter: brightness(0.15); transform: translate(-3px,3px) scale(0.96) skew(-1deg,2deg); }
    72%  { filter: brightness(1.2) saturate(3); transform: translate(1px,-1px) scale(1.02); }
    80%  { filter: brightness(0.1); transform: translate(0,0) scale(1); }
    92%  { filter: brightness(4) saturate(0) contrast(3); transform: scale(1.06); }
    100% { filter: brightness(1) saturate(0) contrast(1); transform: scale(1); opacity: 0; }
  }

  /* cache le formulaire tout en le laissant fonctionnel (pour la commande cachée) */
  .oculte-404 {
    position: absolute !important;
    left: -9999px !important;
    top: -9999px !important;
  }

  /* fausse page d'erreur façon déploiement statique, sobre et blanche */
  body.page-404 {
    background: #fff !important;
    animation: none !important;
    filter: none !important;
  }
  body.page-404::before { display: none !important; }

  #page-404 {
    position: fixed;
    inset: 0;
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    z-index: 999;
  }
  .page-404-bloc {
    display: flex;
    align-items: center;
    gap: 18px;
  }
  .page-404-code {
    font-size: 15px;
    font-weight: 600;
    color: #000;
  }
  .page-404-trait {
    width: 1px;
    height: 17px;
    background: #ccc;
  }
  .page-404-texte {
    font-size: 14px;
    color: #000;
  }
  .page-404-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
  }
  .page-404-indice {
    text-align: center;
    font-size: 15px;
    color: #555;
    letter-spacing: 0.3px;
    padding: 0 20px;
  }

  /* ---------- TESTAMENT (déclenché par "chou-fleur" sur la page 404) ---------- */

  #page-testament {
    position: fixed;
    inset: 0;
    background: #040704;
    color: var(--vert);
    font-family: 'Share Tech Mono', monospace;
    z-index: 1000;
    display: flex;
    justify-content: center;
    padding: 36px 18px;
    overflow-y: auto;
  }
  .testament-bloc {
    max-width: 680px;
    width: 100%;
  }
  .testament-entete {
    font-size: 11px;
    letter-spacing: 2px;
    color: var(--vert-terne);
    border-bottom: 1px solid var(--vert-terne);
    padding-bottom: 10px;
    margin-bottom: 18px;
  }
  .testament-corps {
    white-space: pre-wrap;
    line-height: 1.7;
    font-size: 13px;
    text-shadow: 0 0 4px rgba(51,255,102,0.4);
  }
  @keyframes testament-tremble {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.93; }
  }
  .testament-corps {
    animation: testament-tremble 4s infinite;
  }

  form {
    display: flex;
    border-top: 1px solid var(--vert-terne);
    flex-shrink: 0;
  }

  input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--vert);
    font-family: inherit;
    font-size: 15px;
    padding: 14px 16px;
    caret-color: var(--vert);
  }

  input::placeholder { color: var(--vert-terne); }

  input:disabled { opacity: 0.5; }

  button {
    background: transparent;
    border: none;
    border-left: 1px solid var(--vert-terne);
    color: var(--vert);
    font-family: inherit;
    padding: 0 20px;
    cursor: pointer;
    letter-spacing: 2px;
  }
  button:hover { background: rgba(51,255,102,0.08); }
  button:disabled { color: var(--vert-terne); cursor: default; }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-thumb { background: var(--vert-terne); }
</style>
</head>
<body>

<div id="allumage"></div>

<header>
  <div class="entete-ligne">
    <div>
      <div class="titre">SCHRECKNET</div>
      <div class="sous-titre">connexion non chiffrée · relais inconnu · ne pas faire confiance</div>
    </div>
    <button type="button" id="bouton-son" aria-label="Couper ou activer le son">🔊</button>
  </div>
</header>

<div class="portrait">
  <video class="portrait-video" src="/avatar.webm" autoplay muted loop playsinline></video>
  <div class="portrait-label">SIGNAL INSTABLE</div>
  <img class="badge" src="/icon.png" alt="Sceau du clan Nosferatu">
</div>

<div class="ticker" aria-hidden="true">
  <div class="ticker-piste">
    <span id="ticker-texte-1"></span><span id="ticker-texte-2"></span>
  </div>
</div>

<div id="fil"></div>

<form id="formulaire">
  <input id="champ" type="text" placeholder="écrire un message..." autocomplete="off">
  <button type="submit" id="envoyer">ENVOYER</button>
</form>

<script>
/* ============================================================
   EFFACEMENT DÉFINITIF — à régler avant la session.

   ARMER_EFFACEMENT = true  → le TOUT PROCHAIN message envoyé par
   n'importe qui déclenche la destruction du réseau (au lieu d'une
   réponse de l'IA) : écran qui sature, se déforme, tremble de plus
   en plus fort, flash blanc, puis atterrissage sur une fausse page
   d'erreur 404 — comme si le site n'avait jamais existé.

   Pour tester sans risque : tape "reset-grele" dans le champ de
   message, à tout moment — même sur la page 404 (le champ reste
   actif mais invisible ; un clic n'importe où sur la page lui
   redonne le focus). Ça efface juste le statut "mort" du site,
   sans toucher à l'historique de conversation réel. Répétable à
   volonté pendant tes tests.
   ============================================================ */
const ARMER_EFFACEMENT = true;
const CLE_EFFACEMENT = 'schrecknet-efface';
/* ============================================================ */

let siteMort = false;

const fil = document.getElementById('fil');
const formulaire = document.getElementById('formulaire');
const champ = document.getElementById('champ');
const boutonEnvoyer = document.getElementById('envoyer');
const boutonSon = document.getElementById('bouton-son');

const reduireMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- suppression du flash d'allumage ---------- */
const allumage = document.getElementById('allumage');
allumage.addEventListener('animationend', () => allumage.remove());
setTimeout(() => allumage.remove(), 1000); // filet de sécurité

/* ---------- glitch occasionnel ---------- */
function declencherGlitch() {
  if (siteMort) return;
  if (!reduireMotion) {
    document.body.classList.add('glitch');
    setTimeout(() => document.body.classList.remove('glitch'), 200);
  }
  setTimeout(declencherGlitch, 15000 + Math.random() * 25000);
}
if (!reduireMotion) setTimeout(declencherGlitch, 8000 + Math.random() * 10000);

/* ---------- ticker de faux logs anti-PRISM ---------- */
const segmentsTicker = [
  'DÉTECTION PRISM: BROUILLAGE ACTIF',
  'ANALYSE TRAFIC: NÉGATIF',
  'PARE-FEU FANTÔME: EN LIGNE',
  'SIGNATURE EFFACÉE',
  'ÉCOUTE DÉTECTÉE: CONTRE-MESURE ENGAGÉE',
  'CHIFFREMENT RENOUVELÉ',
  'NŒUD RELAIS INSTABLE',
  'PAQUET REDIRIGÉ',
];
function hexAleatoire(n) {
  let s = '';
  for (let i = 0; i < n; i++) s += Math.floor(Math.random() * 16).toString(16).toUpperCase();
  return s;
}
function genererLigneTicker() {
  const nb = 5 + Math.floor(Math.random() * 3);
  const parties = [];
  for (let i = 0; i < nb; i++) {
    const base = segmentsTicker[Math.floor(Math.random() * segmentsTicker.length)];
    parties.push(base + ' [' + hexAleatoire(4) + ']');
  }
  return parties.join('   ·   ') + '   ·   ';
}
function rafraichirTicker() {
  const texte = genererLigneTicker();
  document.getElementById('ticker-texte-1').textContent = texte;
  document.getElementById('ticker-texte-2').textContent = texte;
}
rafraichirTicker();
const intervalTicker = setInterval(rafraichirTicker, 45000);

/* ---------- son : bascule + bruit de clavier + bourdonnement de fond ---------- */
let sonActif = localStorage.getItem('schrecknet-son') !== 'off';
boutonSon.textContent = sonActif ? '🔊' : '🔇';

let audioCtx = null;
function obtenirAudioCtx() {
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return null;
  if (!audioCtx) audioCtx = new AC();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function clicClavier() {
  if (!sonActif) return;
  const ctx = obtenirAudioCtx();
  if (!ctx) return;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = 'square';
  osc.frequency.value = 1000 + Math.random() * 900;
  gain.gain.setValueAtTime(0.04, ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.025);
  osc.connect(gain).connect(ctx.destination);
  osc.start();
  osc.stop(ctx.currentTime + 0.03);
}

let intervalleClavier = null;
function demarrerBruitClavier() {
  clicClavier();
  intervalleClavier = setInterval(clicClavier, 70 + Math.random() * 90);
}
function arreterBruitClavier() {
  if (intervalleClavier) {
    clearInterval(intervalleClavier);
    intervalleClavier = null;
  }
}

let bourdonnement = null;
function demarrerBourdonnement() {
  if (!sonActif || bourdonnement) return;
  const ctx = obtenirAudioCtx();
  if (!ctx) return;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = 'sine';
  osc.frequency.value = 55;
  gain.gain.value = 0.015;
  osc.connect(gain).connect(ctx.destination);
  osc.start();
  bourdonnement = { osc, gain };
}
function arreterBourdonnement() {
  if (bourdonnement) {
    bourdonnement.osc.stop();
    bourdonnement = null;
  }
}

// démarre le bourdonnement dès la première interaction (contrainte des navigateurs)
function demarrerAuPremierGeste() {
  if (sonActif) demarrerBourdonnement();
}
window.addEventListener('pointerdown', demarrerAuPremierGeste, { once: true });
window.addEventListener('keydown', demarrerAuPremierGeste, { once: true });

boutonSon.addEventListener('click', () => {
  sonActif = !sonActif;
  localStorage.setItem('schrecknet-son', sonActif ? 'on' : 'off');
  boutonSon.textContent = sonActif ? '🔊' : '🔇';
  if (sonActif) demarrerBourdonnement();
  else {
    arreterBourdonnement();
    arreterBruitClavier();
  }
});

/* ---------- alerte rouge dramatique (quota dépassé uniquement) ---------- */
function declencherAlertePrism(messageReel) {
  if (!reduireMotion) {
    const overlay = document.createElement('div');
    overlay.id = 'alerte-rouge';
    document.body.appendChild(overlay);
    overlay.addEventListener('animationend', () => overlay.remove());
    setTimeout(() => overlay.remove(), 1500); // filet de sécurité
  }
  const texteDramatique =
    '!!! TENTATIVE D\'INTRUSION DÉTECTÉE — SIGNATURE PRISM !!!\n' +
    'REROUTAGE D\'URGENCE DU CANAL EN COURS...\n' +
    'CANAL SUSPENDU — ' + messageReel;
  ajouterMessage('alerte', texteDramatique);
}

/* ---------- historique de conversation ---------- */
const CLE_STOCKAGE = 'schrecknet-historique';
let historique = [];
try {
  historique = JSON.parse(localStorage.getItem(CLE_STOCKAGE) || '[]');
} catch (e) {
  historique = [];
}

function revelerTexte(element, texte, dureeMax) {
  const total = texte.length;
  const duree = Math.min(dureeMax || 2200, Math.max(500, total * 16));
  const pas = Math.max(1, Math.round(total / (duree / 16)));
  let i = 0;
  const minuteur = setInterval(() => {
    i += pas;
    if (i >= total) {
      element.textContent = texte;
      clearInterval(minuteur);
    } else {
      element.textContent = texte.slice(0, i);
    }
    fil.scrollTop = fil.scrollHeight;
  }, 16);
}

function ajouterMessage(role, texte, animer) {
  const div = document.createElement('div');
  const classesParRole = { user: 'joueur', model: 'nosferatu', alerte: 'alerte' };
  div.className = 'msg ' + (classesParRole[role] || 'systeme');

  if (role === 'user' || role === 'model') {
    const etiquette = document.createElement('div');
    etiquette.className = 'expediteur';
    etiquette.textContent = role === 'user' ? 'Anon' : '13_Grê13';
    div.appendChild(etiquette);
  }

  const contenu = document.createElement('div');
  div.appendChild(contenu);
  fil.appendChild(div);

  if (animer && role === 'model' && !reduireMotion) {
    revelerTexte(contenu, texte);
  } else {
    contenu.textContent = texte;
  }

  fil.scrollTop = fil.scrollHeight;
}

function rejouerHistorique() {
  fil.innerHTML = '';
  if (historique.length === 0) {
    ajouterMessage('systeme', 'connexion établie. quelqu\'un observe déjà.');
  }
  historique.forEach((m) => ajouterMessage(m.role, m.text));
}

/* ---------- testament du Grêlé (débloqué par "chou-fleur" sur la page 404) ---------- */

const TEXTE_TESTAMENT =
`==============================================================================

[FICHIER : TESTAMENT_VERSTRAETE.TXT - NE PAS EFFACER - NON, NON !]
==============================================================================

Et puis 1867... la fange, les pustules, le sang noir dans ma gorge. Le monstre m'a laissé dans la brique humide. Je suis devenu l'Horreur.

Mais les Anciens... les Vieux ont des yeux qui brûlent. John Dane... Khalid... ils ne voient rien. Ils croient régner depuis Randolph Tower.

Et ce n'était pas la Camarilla. Non, non, non ! C'ÉTAIT ELLE. KEMINTIRI. La Fille de Set. Le serpent sur la Liste Rouge. Elle portait le visage d'un autre... Masque aux mille visages... Elle m'a trompé ! Elle m'a volé ! Elle a utilisé mes données pour infiltrer les domaines, pour égorger, pour empoisonner !

function afficherTestament() {
  if (document.getElementById('page-testament')) return;
  const overlay = document.createElement('div');
  overlay.id = 'page-testament';
  overlay.innerHTML =
    '<div class="testament-bloc">' +
      '<div class="testament-entete">13_GRÊ13 · DERNIÈRE TRANSMISSION · INTÉGRITÉ DU FICHIER : INCERTAINE</div>' +
      '<div class="testament-corps"></div>' +
    '</div>';
  document.body.appendChild(overlay);
  const corps = overlay.querySelector('.testament-corps');
  if (reduireMotion) {
    corps.textContent = TEXTE_TESTAMENT;
  } else {
    revelerTexte(corps, TEXTE_TESTAMENT, 11000);
  }
}

/* ---------- effacement définitif du réseau ---------- */

async function lancerEffacement() {
  siteMort = true;
  clearInterval(intervalTicker);

  // le dernier message reste visible un court instant avant que tout parte en vrille
  await new Promise((r) => setTimeout(r, 900));

  if (!reduireMotion) {
    document.body.classList.add('effacement');
  }

  // les messages disparaissent les uns après les autres, du plus ANCIEN au
  // plus récent — le dernier message tapé (celui qui a tout déclenché) reste
  // visible le plus longtemps possible au milieu du chaos.
  const messages = Array.from(fil.children);
  messages.forEach((m, i) => {
    setTimeout(() => m.classList.add('disparu'), 150 * i);
  });

  await new Promise((r) => setTimeout(r, reduireMotion ? 200 : 5000));

  afficherErreur404();
}

function afficherErreur404() {
  document.body.classList.remove('effacement');
  document.body.style.filter = '';

  // cache l'interface normale ; le formulaire reste fonctionnel mais invisible,
  // pour que la commande cachée de réinitialisation continue de marcher
  document.querySelector('header').style.display = 'none';
  document.querySelector('.portrait').style.display = 'none';
  document.querySelector('.ticker').style.display = 'none';
  fil.style.display = 'none';
  formulaire.classList.add('oculte-404');
  champ.disabled = false;
  boutonEnvoyer.disabled = false;

  if (!document.getElementById('page-404')) {
    const overlay = document.createElement('div');
    overlay.id = 'page-404';
    overlay.innerHTML =
      '<div class="page-404-wrap">' +
        '<div class="page-404-bloc">' +
          '<div class="page-404-code">404</div>' +
          '<div class="page-404-trait"></div>' +
          '<div class="page-404-texte">This page could not be found.</div>' +
        '</div>' +
        '<div class="page-404-indice">si tu es mon légume préféré, écris ton nom</div>' +
      '</div>';
    document.body.appendChild(overlay);
  }
  document.body.classList.add('page-404');

  champ.focus();
}

// un clic n'importe où sur la page 404 redonne le focus au champ caché,
// pour pouvoir taper "reset-grele" à l'aveugle sans viser quoi que ce soit
document.addEventListener('click', () => {
  if (siteMort) champ.focus();
});

/* ---------- état au chargement ---------- */
if (localStorage.getItem(CLE_EFFACEMENT) === 'oui') {
  siteMort = true;
  clearInterval(intervalTicker);
  afficherErreur404();
} else {
  rejouerHistorique();
}

/* ---------- envoi de message ---------- */

formulaire.addEventListener('submit', async (e) => {
  e.preventDefault();
  const texte = champ.value.trim();
  if (!texte) return;

  // Commande cachée réservée aux tests du MJ : restaure le site sans toucher
  // à l'historique de conversation réel. Fonctionne même après la "mort" du site.
  if (texte.toLowerCase() === 'reset-grele') {
    champ.value = '';
    champ.disabled = false;
    boutonEnvoyer.disabled = false;
    localStorage.removeItem(CLE_EFFACEMENT);
    location.reload();
    return;
  }

  // Easter egg pour les joueurs : indice affiché sous la page 404.
  // Accepte "chou-fleur" ou "choufleur", avec ou sans majuscules.
  const texteNormalise = texte.toLowerCase().replace(/[\s-]/g, '');
  if (siteMort && texteNormalise === 'choufleur') {
    champ.value = '';
    afficherTestament();
    return;
  }

  // Le réseau est déjà mort : plus aucune interaction possible.
  if (localStorage.getItem(CLE_EFFACEMENT) === 'oui') return;

  // ---- Déclenchement de l'effacement définitif (le prochain message, quel qu'il soit) ----
  if (ARMER_EFFACEMENT) {
    champ.value = '';
    ajouterMessage('user', texte);
    localStorage.setItem(CLE_EFFACEMENT, 'oui');
    await lancerEffacement();
    return;
  }

  // ---- Comportement normal (si ARMER_EFFACEMENT est mis à false) ----
  if (sonActif) demarrerBourdonnement();

  champ.value = '';
  boutonEnvoyer.disabled = true;

  historique.push({ role: 'user', text: texte });
  ajouterMessage('user', texte);
  localStorage.setItem(CLE_STOCKAGE, JSON.stringify(historique));

  ajouterMessage('systeme', '...');
  demarrerBruitClavier();

  try {
    const reponse = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ history: historique }),
    });
    const donnees = await reponse.json();

    arreterBruitClavier();
    fil.removeChild(fil.lastChild); // enlève le "..."

    if (!reponse.ok) {
      const messageErreur = donnees.erreur || 'inconnue';
      if (/quota/i.test(messageErreur)) {
        declencherAlertePrism(messageErreur);
      } else {
        ajouterMessage('systeme', 'erreur : ' + messageErreur);
      }
    } else {
      historique.push({ role: 'model', text: donnees.reply });
      ajouterMessage('model', donnees.reply, true);
      localStorage.setItem(CLE_STOCKAGE, JSON.stringify(historique));
    }
  } catch (err) {
    arreterBruitClavier();
    fil.removeChild(fil.lastChild);
    ajouterMessage('systeme', 'connexion perdue.');
  }

  boutonEnvoyer.disabled = false;
  champ.focus();
});
</script>
